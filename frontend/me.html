<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLISS — マイポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body>
<div id="app"><div class="portal" id="portal" style="font-family:var(--f-mono);color:var(--ink-mute);padding-top:40px">読み込み中…</div></div>
<script src="api.js"></script><script src="app.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  if(!id){ location.href="login.html"; return; }
  let ep, tl, activeTab="task";
  const STATUS_CYCLE = { "未":"進行中", "進行中":"完了", "完了":"未" };
  const TODAY = new Date().toISOString().slice(0,10);
  const TABS = [["task","マイタスク"],["doc","提出物"],["toi","といちらん"],["tl","予定"],["log","連絡"]];

  async function load(){
    const meta = await API.meta();
    window.lcName = c => (meta.lcs.find(l=>l.code===c)||{name:c}).name;
    [ep, tl] = await Promise.all([API.ep(id), API.timeline(id)]);
    if(ep.error){ document.getElementById("portal").innerHTML="EPが見つかりません"; return; }
    render();
  }

  function nextDeadline(){
    const up = (tl.milestones||[]).find(m=>m.state==="overdue"||m.state==="soon"||m.state==="upcoming");
    return up;
  }

  function render(){
    const op = ep.op;
    const nd = nextDeadline();
    document.getElementById("app").innerHTML = `<div class="portal">
      <div class="ptop">
        <div class="wm">BL<i>I</i>SS<span>マイポータル</span></div>
        <a class="btn sm" href="login.html">切替 / ログアウト</a>
      </div>
      <div class="phero">
        <div class="nm">${ep.name}</div>
        <div class="meta">${ep.lc} ${lcName(ep.lc)} · ${ep.univ} · 担当 ${ep.de_tan}</div>
        <div style="margin-top:10px">${phaseChip(ep.phase)}</div>
        <div class="dest">${op?`${op.flag} ${op.country} / ${op.project}`:'渡航先：未マッチ'}</div>
        ${nd?`<div class="next">⏰ 次の予定：<b>${nd.label}</b>（${nd.date}${nd.daysFromToday!=null?`・${nd.daysFromToday>=0?"あと"+nd.daysFromToday+"日":Math.abs(nd.daysFromToday)+"日超過"}`:""}）</div>`:""}
      </div>
      <div class="ptabs">${TABS.map(([t,l])=>`<button class="ptab ${t===activeTab?"on":""}" data-tab="${t}">${l}</button>`).join("")}</div>
      <div id="ptab"></div></div>`;
    $$(".ptab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render();});
    renderTab();
  }

  function renderTab(){
    const t=$("#ptab");
    if(activeTab==="task") return renderTasks(t);
    if(activeTab==="doc") return renderDocs(t);
    if(activeTab==="toi") return renderToi(t);
    if(activeTab==="tl") return renderTl(t);
    if(activeTab==="log") return renderLog(t);
  }

  // --- my tasks (Res = EP) ---
  function renderTasks(t){
    const deadOf = label => { const m=(tl.milestones||[]).find(x=>x.label.includes(label.slice(0,6))); return m?m.date:""; };
    const groups = ep.buckets.map(b=>({label:b.label, tasks:b.tasks.filter(x=>x.res==="EP")})).filter(g=>g.tasks.length);
    t.innerHTML = `<p class="hint">あなたが担当のタスクです。完了したらチェックしてください。</p>` + groups.map(g=>`
      <div class="pcard"><h4>${g.label}<span class="c">${g.tasks.filter(x=>x.status==="完了").length}/${g.tasks.length}</span></h4>
        ${g.tasks.map(tk=>{const dd=deadOf(tk.title);const over=dd&&dd<TODAY&&tk.status!=="完了";return `
          <div class="ptask ${tk.status==="完了"?"done":""} ${over?"over":""}" data-task="${tk.id}">
            <div class="box">${tk.status==="完了"?"✓":tk.status==="進行中"?"◐":""}</div>
            <div class="tx"><b>${tk.title}</b>${tk.note?`<em>${tk.note}</em>`:""}</div>
            ${dd?`<div class="dd">${dd}</div>`:""}
          </div>`;}).join("")}</div>`).join("");
    $$(".ptask").forEach(r=>r.onclick=async()=>{
      const tk=ep.buckets.flatMap(b=>b.tasks).find(x=>x.id===r.dataset.task);
      await API.setTask(id,tk.id,STATUS_CYCLE[tk.status]); await load();
    });
  }

  // --- documents (submit + double-check, both sides) ---
  function renderDocs(t){
    const opts=["未提出","確認中","受領"];
    t.innerHTML = `<p class="hint">書類の提出状況です。提出したら状態を更新し、ダブルチェックを依頼/記録できます。</p>
      <div class="pcard">${ep.docs.map(d=>`
        <div class="ptask" data-doc="${d.id}" style="cursor:default">
          <div class="tx"><b>${d.name}</b></div>
          <select class="selstat" data-sel>${opts.map(o=>`<option ${o===d.status?"selected":""}>${o}</option>`).join("")}</select>
          <button class="tog ${d.double_checked?"on":""}" data-dc style="margin-left:8px">${d.double_checked?"✓ ダブチ済":"ダブチ"}</button>
        </div>`).join("")}</div>`;
    $$("[data-doc]").forEach(r=>{const did=r.dataset.doc;
      r.querySelector("[data-sel]").onchange=async e=>{await API.setDoc(id,did,{status:e.target.value});await load();};
      r.querySelector("[data-dc]").onclick=async()=>{const d=ep.docs.find(x=>x.id===did);await API.setDoc(id,did,{doubleChecked:d.double_checked?0:1});await load();};
    });
  }

  // --- toichiran (fill own fields + double-check) ---
  function renderToi(t){
    t.innerHTML = `<p class="hint">渡航先情報収集一覧（といちらん）。わかった項目から入力 → フォーカスを外すと保存。ダブルチェックも依頼/記録できます。</p>`
      + ep.toiSections.map(s=>`<div class="pcard"><h4>${s.section}</h4>${s.fields.map(f=>`
        <div class="ptask" data-key="${f.key}" style="cursor:default;flex-direction:column;align-items:stretch;gap:6px">
          <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-family:var(--f-min);font-size:13px">${f.label}</b>
            <button class="tog ${f.double_checked?"on":""}" data-dc>${f.double_checked?"✓":"ダブチ"}</button></div>
          <input value="${(f.value||"").replace(/"/g,"&quot;")}" placeholder="出典: ${f.source}" data-val style="border:1px solid var(--rule-2);background:var(--paper);padding:7px 10px;font-size:12.5px">
        </div>`).join("")}</div>`).join("");
    $$("[data-key]").forEach(r=>{const key=r.dataset.key;
      r.querySelector("[data-val]").onblur=async e=>{await API.setToi(id,key,{value:e.target.value});ep.toiSections.flatMap(s=>s.fields).find(f=>f.key===key).value=e.target.value;};
      r.querySelector("[data-dc]").onclick=async()=>{const f=ep.toiSections.flatMap(s=>s.fields).find(f=>f.key===key);await API.setToi(id,key,{doubleChecked:f.double_checked?0:1});await load();};
    });
  }

  // --- my timeline (read-only) ---
  function renderTl(t){
    if(!tl.departure && !tl.return){ t.innerHTML=`<div class="pcard"><p style="font-size:12.5px;color:var(--ink-soft)">担当者が出発日・帰国日を設定すると、ここに渡航準備のスケジュールが表示されます。</p></div>`; return; }
    const pillJp={done:"完了",overdue:"期限超過",soon:"まもなく",upcoming:"予定",nodate:"日付なし",scheduled:"予定"};
    t.innerHTML = `<p class="hint">あなたの渡航スケジュール（出発 ${tl.departure||"—"} ／ 帰国 ${tl.return||"—"}）。</p>
      <div class="pcard"><div class="tl">${tl.milestones.map(m=>`
        <div class="tlrow ${m.state}"><div class="d">${m.date||"—"}</div>
          <div class="lb">${m.label}${m.note?`<em>${m.note}</em>`:""}</div>
          <div class="tlpill ${m.state}">${pillJp[m.state]||m.state}</div></div>`).join("")}</div></div>`;
  }

  // --- messages (post as EP) ---
  function renderLog(t){
    const who={mentor:"担当",ep:ep.name,host:"受入LC",me:"担当"};
    t.innerHTML = `<div class="pcard"><h4>担当者との連絡</h4>
      <div class="log" id="log">${ep.messages.length?ep.messages.map(m=>`
        <div class="msg ${m.sender==="ep"?"me":""}"><div class="meta"><b>${m.name}</b> · ${who[m.sender]||m.sender} · ${m.date}</div><div class="bub">${m.text}</div></div>`).join("")
        :'<p style="font-family:var(--f-mono);font-size:11px;color:var(--ink-mute)">まだメッセージはありません</p>'}</div>
      <div class="composer"><input id="msg" placeholder="担当者にメッセージ…"><button class="btn pri sm" id="send">送信</button></div></div>`;
    const send=async()=>{const x=$("#msg").value.trim();if(!x)return;await API.addMessage(id,x,"ep",ep.name);await load();setTimeout(()=>{const l=$("#log");if(l)l.scrollTop=l.scrollHeight;},30);};
    $("#send").onclick=send; $("#msg").onkeydown=e=>{if(e.key==="Enter")send();};
  }

  await load();
})();
</script></body></html>
