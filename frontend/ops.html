<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLISS — OP検索</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body><div class="shell" id="app"></div>
<script src="api.js"></script><script src="app.js"></script>
<script>
(async () => {
  const v = await mountShell({active:"op"});
  let ops = await API.ops();
  v.innerHTML = `
    <div class="block"><div class="eyebrow">Layer 02 / Opportunity</div>
      <div class="sec-title">OP 検索</div>
      <p class="sec-note">海外 LC が公開する Global Volunteer の案件。希望渡航先フォーム（oGV Tracker）の EY×PJT を反映。地域で絞り込み、マッチングに渡します。</p></div>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="q" placeholder="国・PJT・受入LCで検索…"></div>
      <button class="chip on" data-rg="all">全地域</button>
      <button class="chip" data-rg="asia">アジア</button>
      <button class="chip" data-rg="africa">アフリカ</button>
      <button class="chip" data-rg="latam">中南米</button>
      <button class="chip" data-rg="europe">欧州</button>
      <button class="addbtn" id="addOp" style="margin-left:auto">＋ OP追加</button>
    </div>
    <div class="op-grid" id="grid"></div>`;
  let rg="all";
  function render(){
    const qs=$("#q").value.toLowerCase();
    $("#grid").innerHTML = ops.filter(o=>(rg==="all"||o.region===rg)&&((o.country+o.project+o.org).toLowerCase().includes(qs)))
      .map(o=>`<div class="op">
        <button class="del" data-del="${o.id}" title="削除">×</button>
        <div class="op-top"><span class="op-flag">${o.flag}</span><div class="op-slots">空き<b>${o.slots}</b>枠</div></div>
        <div class="op-b"><div class="op-role">${o.project}</div><div class="op-org">${o.country} · ${o.org}</div>
          <div class="op-tags"><span class="op-tag">${o.sdg}</span><span class="op-tag">${o.region}</span></div></div>
        <div class="op-f"><span>受入 LC 公開</span><span class="dl">締切 ${o.dl}</span></div></div>`).join("")
      || `<p style="font-family:var(--f-mono);font-size:12px;color:var(--ink-mute);grid-column:1/-1;text-align:center;padding:30px">該当する OP がありません</p>`;
  }
  $("#q").oninput=render;
  $$('.chip').forEach(c=>c.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove("on"));c.classList.add("on");rg=c.dataset.rg;render();});
  render();

  async function reload(){ ops = await API.ops(); render(); bindDel(); }
  function bindDel(){
    $$('[data-del]').forEach(b=>b.onclick=async(e)=>{
      e.stopPropagation();
      if(!confirm("このOPを削除しますか？（マッチ済EPは未マッチに戻ります）")) return;
      await API.deleteOp(b.dataset.del); toast("OPを削除しました"); reload();
    });
  }
  $("#addOp").onclick=()=>{
    const bg=el("div","modal-bg");
    bg.innerHTML=`<div class="modal"><div class="modal-h"><h3>OPを追加</h3><span class="x">×</span></div>
      <div class="modal-b"><div class="frm">
        <div><label>国旗(絵文字)</label><input id="o_flag" placeholder="🇹🇭"></div>
        <div><label>国</label><input id="o_country" placeholder="Thailand"></div>
        <div class="full"><label>プロジェクト名</label><input id="o_project" placeholder="happy bus"></div>
        <div class="full"><label>受入LC</label><input id="o_org" placeholder="AIESEC in Bangkok"></div>
        <div><label>枠数</label><input id="o_slots" type="number" value="3"></div>
        <div><label>地域</label><select id="o_region"><option value="asia">アジア</option><option value="africa">アフリカ</option><option value="latam">中南米</option><option value="europe">欧州</option></select></div>
        <div><label>SDG</label><input id="o_sdg" placeholder="SDG4"></div>
        <div><label>締切</label><input id="o_dl" placeholder="08.20"></div>
      </div>
      <div class="frm-actions"><button class="btn" id="o_cancel">キャンセル</button><button class="addbtn" id="o_save">作成</button></div>
      </div></div>`;
    document.body.appendChild(bg);
    const close=()=>bg.remove();
    bg.querySelector(".x").onclick=close; bg.querySelector("#o_cancel").onclick=close;
    bg.onclick=e=>{ if(e.target===bg) close(); };
    bg.querySelector("#o_save").onclick=async()=>{
      const country=$("#o_country").value.trim(), project=$("#o_project").value.trim();
      if(!country&&!project){ $("#o_country").focus(); return; }
      await API.createOp({ flag:$("#o_flag").value.trim()||"🌐", country, project,
        org:$("#o_org").value.trim(), slots:+$("#o_slots").value||1, region:$("#o_region").value,
        sdg:$("#o_sdg").value.trim(), dl:$("#o_dl").value.trim() });
      close(); toast("OPを追加しました"); reload();
    };
  };
  bindDel();
})();
</script></body></html>
