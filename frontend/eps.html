<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLISS — 渡航者管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body><div class="shell" id="app"></div>
<script src="api.js"></script><script src="app.js"></script>
<script>
(async () => {
  const v = await mountShell({active:"ep"});
  let eps = await API.eps();
  v.innerHTML = `
    <div class="block"><div class="eyebrow">Layer 02 / oGV · EP Management</div>
      <div class="sec-title">渡航者 (EP) 管理</div>
      <p class="sec-note">渡航者を EXPA マイルストーンで管理。行をクリックすると、その人の渡航オペレーション一式（運用シート・提出物・といちらん・資格審査）が開きます。</p></div>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="q" placeholder="氏名・LC・渡航先で検索…"></div>
      <button class="chip on" data-ph="all">すべて</button>
      ${LIFECYCLE.map(p=>`<button class="chip" data-ph="${p}">${PHASE_LABEL[p][0]}</button>`).join("")}
      <button class="addbtn" id="addEp" style="margin-left:auto">＋ 新規EP</button>
    </div>
    <table class="tbl"><thead><tr><th>EP</th><th>LC</th><th>渡航先 / OP</th><th>De担 / EPM</th><th>フェーズ</th><th>運用進捗</th></tr></thead>
    <tbody id="rows"></tbody></table>`;

  let curPh="all";
  function render(){
    const qs=$("#q").value.toLowerCase(), rows=$("#rows"); rows.innerHTML="";
    eps.filter(e=>(curPh==="all"||e.phase===curPh)&&((e.name+e.lc+(e.opLabel||"")).toLowerCase().includes(qs)))
      .forEach(e=>{
        const pct=e.progress.total?Math.round(e.progress.done/e.progress.total*100):0;
        const tr=el("tr","clk",`
          <td><div class="who"><b>${e.name}</b><em>${e.univ}</em></div></td>
          <td><span class="lcbadge">${e.lc}</span></td>
          <td><span style="font-family:var(--f-min);font-size:13px">${e.opLabel||'<span style="font-family:var(--f-mono);font-size:11px;color:var(--ink-mute)">未マッチ</span>'}</span></td>
          <td style="font-family:var(--f-mono);font-size:11px;color:var(--ink-soft)">${e.de_tan}<br><span style="color:var(--ink-mute)">${e.epm}</span></td>
          <td>${phaseChip(e.phase)}</td>
          <td><div style="display:flex;align-items:center;gap:8px"><div class="progmini"><i style="width:${pct}%"></i></div><span style="font-family:var(--f-mono);font-size:10px;color:var(--ink-mute)">${e.progress.done}/${e.progress.total}</span></div></td>`);
        tr.onclick=()=>location.href="ep.html?id="+e.id;
        rows.appendChild(tr);
      });
    if(!rows.children.length) rows.innerHTML=`<tr><td colspan="6" style="text-align:center;color:var(--ink-mute);font-family:var(--f-mono);font-size:12px;padding:30px">該当する EP がいません</td></tr>`;
  }
  $("#q").oninput=render;
  $$('.chip').forEach(c=>c.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove("on"));c.classList.add("on");curPh=c.dataset.ph;render();});
  render();

  async function reload(){ eps = await API.eps(); render(); }

  $("#addEp").onclick = () => {
    const lcOpts = META.lcs.map(l=>`<option value="${l.code}">${l.code} ${l.name}</option>`).join("");
    const phOpts = LIFECYCLE.map(p=>`<option value="${p}">${PHASE_LABEL[p][0]}</option>`).join("");
    const bg = el("div","modal-bg");
    bg.innerHTML = `<div class="modal"><div class="modal-h"><h3>新規EPを追加</h3><span class="x">×</span></div>
      <div class="modal-b"><div class="frm">
        <div class="full"><label>氏名 *</label><input id="f_name" placeholder="山田 太郎"></div>
        <div><label>大学・学年</label><input id="f_univ" placeholder="一橋大 1年"></div>
        <div><label>LC</label><select id="f_lc">${lcOpts}</select></div>
        <div><label>De担</label><input id="f_de" placeholder="運営 太郎"></div>
        <div><label>EPM</label><input id="f_epm" placeholder="—"></div>
        <div><label>フェーズ</label><select id="f_phase">${phOpts}</select></div>
        <div><label>研修初日</label><input id="f_tstart" type="date"></div>
        <div><label>出発日</label><input id="f_dep" type="date"></div>
        <div><label>帰国日</label><input id="f_ret" type="date"></div>
        <div class="full"><label>備考（研修日程は自動で入ります）</label><input id="f_note" placeholder="研修初日/出発日/帰国日のどれかを入れると自動"></div>
      </div>
      <div class="frm-actions"><button class="btn" id="f_cancel">キャンセル</button><button class="addbtn" id="f_save">作成</button></div>
      </div></div>`;
    document.body.appendChild(bg);
    const close = () => bg.remove();
    bg.querySelector(".x").onclick = close; bg.querySelector("#f_cancel").onclick = close;
    bg.onclick = e => { if(e.target===bg) close(); };
    let lastAuto="";
    const linkNew = (kind, v) => {
      if(!v) return;
      const p=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d));};
      const add=(dt,n)=>{const x=new Date(dt);x.setUTCDate(x.getUTCDate()+n);return x;}, f=x=>x.toISOString().slice(0,10);
      let S; if(kind==="start")S=p(v); else if(kind==="dep")S=add(p(v),2); else S=add(p(v),-42);
      const end=add(S,41), o={start:f(S),end:f(end),dep:f(add(S,-2)),ret:f(add(end,1))};
      bg.querySelector("#f_tstart").value=o.start; bg.querySelector("#f_dep").value=o.dep; bg.querySelector("#f_ret").value=o.ret;
      const note=bg.querySelector("#f_note"), auto=`研修 ${o.start}〜${o.end}（42日間）｜出発 ${o.dep}・帰国 ${o.ret}`;
      if(!note.value||note.value===lastAuto){ note.value=auto; lastAuto=auto; }
    };
    bg.querySelector("#f_tstart").oninput = e => linkNew("start", e.target.value);
    bg.querySelector("#f_dep").oninput = e => linkNew("dep", e.target.value);
    bg.querySelector("#f_ret").oninput = e => linkNew("ret", e.target.value);
    bg.querySelector("#f_save").onclick = async () => {
      const name = $("#f_name").value.trim();
      if(!name){ $("#f_name").focus(); return; }
      await API.createEp({
        name, univ:$("#f_univ").value.trim(), lc:$("#f_lc").value,
        de_tan:$("#f_de").value.trim(), epm:$("#f_epm").value.trim(),
        phase:$("#f_phase").value, training_start:$("#f_tstart").value||null, note:$("#f_note").value||null,
      });
      close(); toast("EPを追加しました"); reload();
    };
  };
})();
</script></body></html>
